<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Monitor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="vmon.css" />
</head>
<body>
  <div class="vm-root">
    <!-- ── top bar ──────────────────────────────────────────── -->
    <header class="vm-topbar">
      <div class="vm-top-left">
        <button id="vm-start" class="vm-btn start"><i class="fa-solid fa-play"></i><span>Start</span></button>
        <button id="vm-stop" class="vm-btn stop" disabled><i class="fa-solid fa-stop"></i><span>Stop</span></button>
        <button id="vm-fullscreen" class="vm-btn"><i class="fa-solid fa-expand"></i><span>Fullscreen</span></button>
      </div>
      <div class="vm-top-right">
        <span id="vm-pill-status" class="vm-pill">Stopped</span>
        <span class="vm-pill">FPS <b id="vm-stat-fps">--</b></span>
        <span class="vm-pill">NET <b id="vm-stat-net">--</b></span>
      </div>
    </header>

    <div class="vm-body">
      <!-- ── launcher (left) ────────────────────────────────── -->
      <aside class="vm-launcher">
        <div class="vm-launcher-title">Virtual Monitor <span id="vm-client" class="vm-client"></span></div>

        <div class="vm-section">SHELLS</div>
        <div class="vm-item" data-exe="C:\Windows\System32\cmd.exe"><i class="fa-solid fa-terminal"></i> cmd.exe</div>
        <div class="vm-item" data-exe="C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"><i class="fa-solid fa-bolt"></i> powershell.exe</div>

        <div class="vm-section">CHROMIUM</div>
        <div id="vm-chromium-list" class="vm-browser-list"><div class="vm-item muted">checking…</div></div>

        <div class="vm-section">FIREFOX</div>
        <div id="vm-firefox-list" class="vm-browser-list"><div class="vm-item muted">checking…</div></div>

        <div class="vm-section">CUSTOM</div>
        <div class="vm-custom">
          <input id="vm-custom-path" placeholder="C:\Program Files\..." spellcheck="false" />
          <button id="vm-launch-custom" class="vm-btn primary"><i class="fa-solid fa-rocket"></i> Launch</button>
          <button id="vm-explorer" class="vm-btn"><i class="fa-solid fa-folder-open"></i> File Explorer</button>
        </div>
      </aside>

      <!-- ── video (center) ─────────────────────────────────── -->
      <main class="vm-stage" id="vm-stage">
        <canvas id="vm-canvas" width="1280" height="720" tabindex="0"></canvas>
        <div id="vm-overlay" class="vm-overlay">Press Start to attach the virtual display</div>
        <div id="vm-log" class="vm-log"></div>
      </main>

      <!-- ── settings (right) ───────────────────────────────── -->
      <aside class="vm-settings">
        <div class="vm-settings-title"><i class="fa-solid fa-sliders"></i> Settings</div>

        <div class="vm-section">DISPLAY</div>
        <label class="vm-field">Monitor
          <select id="vm-monitor" disabled><option>Virtual display</option></select>
        </label>
        <label class="vm-field">Resolution
          <select id="vm-res">
            <option value="1920x1080" selected>1080p</option>
            <option value="1600x900">900p</option>
            <option value="1366x768">768p</option>
            <option value="1280x720">720p</option>
          </select>
        </label>

        <div class="vm-section">VIDEO</div>
        <label class="vm-field">Bitrate
          <select id="vm-bitrate">
            <option value="1500">1.5 Mbps</option>
            <option value="3000">3 Mbps</option>
            <option value="5000" selected>5 Mbps</option>
            <option value="8000">8 Mbps</option>
            <option value="12000">12 Mbps</option>
          </select>
        </label>
        <label class="vm-field">Transport
          <select disabled><option>Binary WS (H.264)</option></select>
        </label>
        <label class="vm-field">Max FPS
          <select id="vm-fps">
            <option value="15">15 fps</option>
            <option value="30" selected>30 fps</option>
            <option value="60">60 fps</option>
          </select>
        </label>

        <div class="vm-section">INPUT &amp; CAPTURE</div>
        <label class="vm-check"><input type="checkbox" id="vm-input-toggle" /> Enable mouse &amp; keyboard</label>
      </aside>
    </div>
  </div>
  <script src="vmon.js"></script>
</body>
</html>
